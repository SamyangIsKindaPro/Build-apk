name: Build APK from discordapk.zip v5

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip discordapk.zip
        run: |
          rm -rf project_src
          mkdir -p project_src
          unzip -q discordapk.zip -d project_src
          touch project_src/.env.example project_src/.env
          find project_src -maxdepth 2 -type d -exec touch "{}/.env.example" "{}/.env" \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          GRADLE_FILE=$(find project_src -maxdepth 4 -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          
