
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found in repository root."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          find extracted -name gradlew -exec chmod +x {} \;

      - name: Locate Android project
        run: |
          GRADLEW=$(find extracted -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "No Gradle wrapper found. This ZIP may not contain a buildable Android project."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
